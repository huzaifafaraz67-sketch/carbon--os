<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon OS - Web Desktop Environment</title>
  
  <!-- External Libraries from /lib/ -->
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="lib/tailwind.min.css">
  <link rel="stylesheet" href="lib/animate.min.css">
  <link rel="stylesheet" href="lib/fontawesome.min.css">
  
  <!-- Carbon OS Master Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="select-none overflow-hidden h-screen w-screen bg-gray-900 text-gray-100 font-sans">

  <!-- ========================================== -->
  <!-- 1. DESKTOP CANVAS & WORKSPACE              -->
  <!-- ========================================== -->
  <div id="desktop" class="relative w-full h-full overflow-hidden bg-cover bg-center transition-all duration-500">
    
    <!-- Desktop Grid Icons -->
    <div id="desktop-grid" class="p-4 grid grid-flow-col grid-rows-6 gap-4 w-max h-full">
      
      <!-- Calculator Launcher -->
      <div class="desktop-icon group flex flex-col items-center justify-center p-3 rounded-xl w-24 h-24 hover:bg-white/10 cursor-pointer transition-all border border-transparent hover:border-white/20" onclick="CarbonOS.openApp('calculator')">
        <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-lg group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m-6 4h6m-6 4h6M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <span class="text-xs text-white font-medium mt-2 drop-shadow-md tracking-wide">Calculator</span>
      </div>

      <!-- Text Editor Launcher -->
      <div class="desktop-icon group flex flex-col items-center justify-center p-3 rounded-xl w-24 h-24 hover:bg-white/10 cursor-pointer transition-all border border-transparent hover:border-white/20" onclick="CarbonOS.openApp('texteditor')">
        <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-400 shadow-lg group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </div>
        <span class="text-xs text-white font-medium mt-2 drop-shadow-md tracking-wide">Notes</span>
      </div>

      <!-- Terminal Launcher -->
      <div class="desktop-icon group flex flex-col items-center justify-center p-3 rounded-xl w-24 h-24 hover:bg-white/10 cursor-pointer transition-all border border-transparent hover:border-white/20" onclick="CarbonOS.openApp('terminal')">
        <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-gradient-to-tr from-gray-800 to-gray-900 border border-gray-700 shadow-lg group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <span class="text-xs text-white font-medium mt-2 drop-shadow-md tracking-wide">Terminal</span>
      </div>

      <!-- Settings Launcher -->
      <div class="desktop-icon group flex flex-col items-center justify-center p-3 rounded-xl w-24 h-24 hover:bg-white/10 cursor-pointer transition-all border border-transparent hover:border-white/20" onclick="CarbonOS.openApp('settings')">
        <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-gradient-to-tr from-purple-600 to-pink-500 shadow-lg group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <span class="text-xs text-white font-medium mt-2 drop-shadow-md tracking-wide">Settings</span>
      </div>

      <!-- File Manager Launcher -->
      <div class="desktop-icon group flex flex-col items-center justify-center p-3 rounded-xl w-24 h-24 hover:bg-white/10 cursor-pointer transition-all border border-transparent hover:border-white/20" onclick="CarbonOS.openApp('files')">
        <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-gradient-to-tr from-amber-500 to-orange-400 shadow-lg group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
        </div>
        <span class="text-xs text-white font-medium mt-2 drop-shadow-md tracking-wide">Files</span>
      </div>

    </div>

    <!-- Dynamic App Windows Container -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none">
      
      <!-- CALCULATOR WINDOW TEMPLATE -->
      <div id="window-calculator" class="carbon-window absolute hidden pointer-events-auto w-80 bg-gray-900/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden" style="top: 100px; left: 150px; z-index: 10;">
        <div class="window-header flex items-center justify-between px-4 py-3 bg-white/5 border-b border-white/10 cursor-move">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m-6 4h6m-6 4h6M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-xs font-semibold text-gray-200 tracking-wider">Calculator</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="CarbonOS.minimizeApp('calculator')" class="w-3 h-3 rounded-full bg-yellow-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.maximizeApp('calculator')" class="w-3 h-3 rounded-full bg-green-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.closeApp('calculator')" class="w-3 h-3 rounded-full bg-red-500 hover:opacity-80 transition-opacity"></button>
          </div>
        </div>
        <div class="window-body p-4">
          <div id="calc-display" class="w-full h-14 bg-black/40 rounded-xl p-3 text-right text-2xl font-mono text-white overflow-x-auto border border-white/5 mb-4">0</div>
          <div class="grid grid-cols-4 gap-2">
            <button class="calc-btn text-red-400 bg-white/5 hover:bg-white/10" onclick="Calc.clear()">C</button>
            <button class="calc-btn text-blue-400 bg-white/5 hover:bg-white/10" onclick="Calc.press('(')">(</button>
            <button class="calc-btn text-blue-400 bg-white/5 hover:bg-white/10" onclick="Calc.press(')')">)</button>
            <button class="calc-btn text-amber-400 bg-white/5 hover:bg-white/10" onclick="Calc.press('/')">/</button>

            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('7')">7</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('8')">8</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('9')">9</button>
            <button class="calc-btn text-amber-400 bg-white/5 hover:bg-white/10" onclick="Calc.press('*')">*</button>

            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('4')">4</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('5')">5</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('6')">6</button>
            <button class="calc-btn text-amber-400 bg-white/5 hover:bg-white/10" onclick="Calc.press('-')">-</button>

            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('1')">1</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('2')">2</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('3')">3</button>
            <button class="calc-btn text-amber-400 bg-white/5 hover:bg-white/10" onclick="Calc.press('+')">+</button>

            <button class="calc-btn col-span-2 bg-white/5 hover:bg-white/10" onclick="Calc.press('0')">0</button>
            <button class="calc-btn bg-white/5 hover:bg-white/10" onclick="Calc.press('.')">.</button>
            <button class="calc-btn bg-blue-600 hover:bg-blue-500 text-white font-bold" onclick="Calc.calculate()">=</button>
          </div>
        </div>
      </div>

      <!-- TEXT EDITOR WINDOW TEMPLATE -->
      <div id="window-texteditor" class="carbon-window absolute hidden pointer-events-auto w-[500px] h-[380px] bg-gray-900/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden" style="top: 140px; left: 320px; z-index: 10;">
        <div class="window-header flex items-center justify-between px-4 py-3 bg-white/5 border-b border-white/10 cursor-move">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            <span class="text-xs font-semibold text-gray-200 tracking-wider">Carbon Notes</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="CarbonOS.minimizeApp('texteditor')" class="w-3 h-3 rounded-full bg-yellow-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.maximizeApp('texteditor')" class="w-3 h-3 rounded-full bg-green-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.closeApp('texteditor')" class="w-3 h-3 rounded-full bg-red-500 hover:opacity-80 transition-opacity"></button>
          </div>
        </div>
        <div class="window-body flex flex-col h-[calc(100%-49px)] p-3 space-y-2">
          <div class="flex items-center space-x-2 pb-2 border-b border-white/10">
            <input type="text" id="note-filename" value="document.txt" class="bg-black/40 text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-white/10 focus:outline-none focus:border-emerald-500 w-48">
            <button onclick="TextEditor.save()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-lg transition-colors font-medium">Save to VFS</button>
            <button onclick="TextEditor.clear()" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-gray-300 text-xs rounded-lg transition-colors">Clear</button>
          </div>
          <textarea id="note-content" class="w-full flex-grow bg-black/30 text-gray-200 p-3 rounded-xl border border-white/5 focus:outline-none font-mono text-sm resize-none" placeholder="Type your text here..."></textarea>
        </div>
      </div>

      <!-- TERMINAL WINDOW TEMPLATE -->
      <div id="window-terminal" class="carbon-window absolute hidden pointer-events-auto w-[550px] h-[340px] bg-black/95 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden" style="top: 200px; left: 220px; z-index: 10;">
        <div class="window-header flex items-center justify-between px-4 py-3 bg-white/5 border-b border-white/10 cursor-move">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-xs font-semibold text-gray-200 tracking-wider">Carbon CLI Terminal</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="CarbonOS.minimizeApp('terminal')" class="w-3 h-3 rounded-full bg-yellow-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.maximizeApp('terminal')" class="w-3 h-3 rounded-full bg-green-500 hover:opacity-80 transition-opacity"></button>
            <button onclick="CarbonOS.closeApp('terminal')" class="w-3 h-3 rounded-full bg-red-500 hover:opacity-80 transition-opacity"></button>
          </div>
        </div>
        <div class="window-body flex flex-col h-[calc(100%-49px)] p-4 font-mono text-xs text-green-400 space-y-2">
          <div id="terminal-output" class="flex-grow overflow-y-auto space-y-1">
            <p class="text-gray-400">Carbon OS v1.0.0 Terminal Interface</p>
            <p class="text-gray-500">Type 'help' to view available system commands.</p>
          </div>
          <div class="flex items-center space-x-2 border-t border-white/10 pt-2">
            <span class="text-emerald-400 font-bold">carbon@user:~$</span>
            <input type="text" id="terminal-input" class="flex-grow bg-transparent text-green-400 focus:outline-none" autofocus onkeydown="Terminal.handleKey(event)">
          </div>
        </div>
      </div>

    </div>

    <!-- START MENU OVERLAY -->
    <div id="start-menu" class="absolute bottom-16 left-4 hidden w-80 bg-gray-900/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl p-4 z-50 animate__animated animate__fadeInUp animate__faster">
      <div class="flex items-center space-x-3 pb-3 mb-3 border-b border-white/10">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow-lg">C</div>
        <div>
          <h4 class="text-sm font-semibold text-white">Carbon User</h4>
          <p class="text-xs text-gray-400">Administrator</p>
        </div>
      </div>
      <div class="space-y-1">
        <button onclick="CarbonOS.openApp('calculator'); CarbonOS.toggleStartMenu();" class="w-full flex items-center space-x-3 p-2 rounded-xl hover:bg-white/10 transition-colors">
          <span class="p-2 rounded-lg bg-blue-500/20 text-blue-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m-6 4h6m-6 4h6M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></span>
          <span class="text-xs font-medium text-gray-200">Calculator</span>
        </button>
        <button onclick="CarbonOS.openApp('texteditor'); CarbonOS.toggleStartMenu();" class="w-full flex items-center space-x-3 p-2 rounded-xl hover:bg-white/10 transition-colors">
          <span class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></span>
          <span class="text-xs font-medium text-gray-200">Notes Editor</span>
        </button>
        <button onclick="CarbonOS.openApp('terminal'); CarbonOS.toggleStartMenu();" class="w-full flex items-center space-x-3 p-2 rounded-xl hover:bg-white/10 transition-colors">
          <span class="p-2 rounded-lg bg-gray-500/20 text-gray-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></span>
          <span class="text-xs font-medium text-gray-200">CLI Terminal</span>
        </button>
      </div>
      <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center">
        <button onclick="CarbonOS.restart()" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Restart OS</span>
        </button>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- 2. SYSTEM TASKBAR & SYSTEM TRAY           -->
  <!-- ========================================== -->
  <div id="taskbar" class="fixed bottom-0 left-0 right-0 h-14 bg-gray-950/80 backdrop-blur-2xl border-t border-white/10 flex items-center justify-between px-4 z-40">
    
    <!-- Left Section: Start Button & App Launcher Indicators -->
    <div class="flex items-center space-x-3">
      <button onclick="CarbonOS.toggleStartMenu()" class="p-2.5 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 hover:opacity-90 transition-all shadow-lg active:scale-95">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      </button>

      <!-- Active Apps Taskbar Dock -->
      <div id="taskbar-apps" class="flex items-center space-x-2 border-l border-white/10 pl-3">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Right Section: System Tray & Live Clock -->
    <div class="flex items-center space-x-4 text-xs font-medium text-gray-300">
      <div id="system-clock" class="text-right flex flex-col leading-tight">
        <span id="clock-time" class="text-sm font-semibold text-white">12:00 PM</span>
        <span id="clock-date" class="text-[10px] text-gray-400">Sep 17, 2026</span>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/os-core.js"></script>
  <script src="apps/calculator.js"></script>
  <script src="apps/texteditor.js"></script>
  <script src="apps/terminal.js"></script>
</body>
</html>
